name: Experiment proposal
description: Propose a controlled scheduler, storage or workload experiment.
title: "[Experiment]: "
labels: [experiment]
body:
  - type: textarea
    id: question
    attributes:
      label: Research question
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis and expected outcome
    validations:
      required: true
  - type: textarea
    id: controls
    attributes:
      label: Controls and variables
      description: Include hardware, Slurm release, workload, repetitions and safety limits.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Measurement plan
