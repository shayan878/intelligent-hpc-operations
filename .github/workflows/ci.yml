name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Check Python syntax
        run: python -m compileall -q src tests
      - name: Check shell syntax
        run: bash -n scripts/*.sh jobs/slurm/*.sbatch
      - name: Validate Slurm example
        run: bash scripts/validate-config.sh configs/slurm/slurm.conf.example
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
