<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Slurm HPC Cluster Lab architecture</title>
<desc id="desc">Operator and LLM assistant connect to a Slurm controller, shared NFS storage, accounting database and two Slurm worker nodes.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#162d43"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#047857"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity=".35"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/></marker>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<circle cx="1060" cy="65" r="125" fill="#0ea5e9" opacity=".08"/><circle cx="110" cy="370" r="170" fill="#14b8a6" opacity=".07"/>
<text x="54" y="58" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">SLURM HPC CLUSTER LAB</text>
<text x="54" y="91" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="14">A compact, reproducible cluster architecture</text>
<g filter="url(#shadow)">
  <rect x="54" y="138" width="205" height="205" rx="18" fill="#1e293b" stroke="#475569"/>
  <rect x="78" y="164" width="157" height="54" rx="12" fill="url(#blue)"/>
  <text x="156" y="187" text-anchor="middle" fill="white" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">OPERATOR</text>
  <text x="156" y="204" text-anchor="middle" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="11">CLI / approvals</text>
  <rect x="78" y="234" width="157" height="78" rx="12" fill="#312e81" stroke="#818cf8"/>
  <text x="156" y="260" text-anchor="middle" fill="white" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">LLM ASSISTANT</text>
  <text x="156" y="280" text-anchor="middle" fill="#c7d2fe" font-family="Inter,Arial,sans-serif" font-size="11">Typed, guarded tools</text>
  <text x="156" y="296" text-anchor="middle" fill="#c7d2fe" font-family="Inter,Arial,sans-serif" font-size="10">No arbitrary shell</text>
  <rect x="352" y="138" width="245" height="205" rx="18" fill="#172c44" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="374" y="160" width="201" height="52" rx="11" fill="url(#blue)"/>
  <text x="474" y="182" text-anchor="middle" fill="white" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">CONTROLLER</text>
  <text x="474" y="199" text-anchor="middle" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="11">slurmctld · slurmdbd</text>
  <rect x="374" y="227" width="94" height="83" rx="10" fill="#334155"/>
  <text x="421" y="255" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">NFS</text>
  <text x="421" y="274" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="10">Shared files</text>
  <text x="421" y="289" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="10">root_squash</text>
  <rect x="481" y="227" width="94" height="83" rx="10" fill="#334155"/>
  <text x="528" y="255" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">DB</text>
  <text x="528" y="274" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="10">MariaDB</text>
  <text x="528" y="289" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="10">Accounting</text>
  <rect x="690" y="138" width="220" height="205" rx="18" fill="#102d36" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="800" y="169" text-anchor="middle" fill="#99f6e4" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">WORKER NODES</text>
  <rect x="711" y="188" width="178" height="55" rx="11" fill="url(#green)"/>
  <text x="800" y="211" text-anchor="middle" fill="white" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">WORKER 01</text>
  <text x="800" y="228" text-anchor="middle" fill="#ccfbf1" font-family="Inter,Arial,sans-serif" font-size="10">slurmd · cgroup</text>
  <rect x="711" y="258" width="178" height="55" rx="11" fill="url(#green)"/>
  <text x="800" y="281" text-anchor="middle" fill="white" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">WORKER 02</text>
  <text x="800" y="298" text-anchor="middle" fill="#ccfbf1" font-family="Inter,Arial,sans-serif" font-size="10">slurmd · cgroup</text>
  <rect x="1002" y="162" width="146" height="155" rx="18" fill="#1e293b" stroke="#64748b"/>
  <text x="1075" y="196" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">WORKLOADS</text>
  <text x="1075" y="225" text-anchor="middle" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="12">sbatch</text>
  <text x="1075" y="248" text-anchor="middle" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="12">srun</text>
  <text x="1075" y="271" text-anchor="middle" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="12">sacct</text>
  <text x="1075" y="294" text-anchor="middle" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="10">CPU / memory jobs</text>
</g>
<g fill="none" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow)">
  <path d="M259 239 C300 239 310 239 350 239"/>
  <path d="M597 239 C635 239 650 239 688 239"/>
  <path d="M910 239 C950 239 960 239 1000 239"/>
</g>
<text x="600" y="386" text-anchor="middle" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="11">Illustrative topology — replace node counts, network ranges and services for your environment</text>
</svg>
